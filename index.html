<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Trace Table</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<a href="index.html"><img src="logo.png" width="250" height="80"></a>

<div class="container">
    <!-- LEFT PANEL -->
    <div class="left">
        <lebel>JavaScript Code:</lebel><br>
        <textarea style="font-size:20px;" id="code">
for (let i = 1; i <= 20; i++) {
 if (i % 2 == 0) {
    continue; 
  }
  if (i == 15) {
    break;
  }
  console.log(i);
}
        </textarea>

        <button class="runBtn" onclick="runCode()">RUN ▶</button><br>
        
        <!-- Moved Navigation Buttons Here -->
        <div class="navButtons">
            <button onclick="prevStep()">Prev</button>
            <button onclick="nextStep()">Next</button>
        </div>

        <p>Output:</p>
        <div class="outputBox">
            <pre id="output"></pre>
        </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right">
        <h3>Trace Table</h3>
        <div class="table-container">
            <table>
                <thead id="tableHead"></thead>
                <tbody id="traceTable"></tbody>
            </table>
        </div>
    </div>
</div>

<footer class="footer">
    <div class="footer-links">

    </div>

</footer>

<script src="tracing.js"></script>
<script>
    let editor = CodeMirror.fromTextArea(document.getElementById("code"), {
        mode: "javascript",
        lineNumbers: true,
        theme: "eye-comfort" // Ensure this matches your CSS class
    });
</script>
</body>
</html>
